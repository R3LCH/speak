[package]
name = "speak"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
hound = "3"
serde_json = "1"
rdev = "0.5"
evdev = "0.12"
ctrlc = "3"

[dev-dependencies]
tempfile = "3"
